<script id="library-data" type="application/json">{"version": 1, "id": "301a05ba5297953c", "demo": true, "books": [{"id": "reading-note-demo", "title": "把笔记写成能回答的问题", "author": "Book Wiki Reader 原创示例", "chunks": ["raw/books/reading-note-demo/chunks/chunk-0001.md", "raw/books/reading-note-demo/chunks/chunk-0002.md", "raw/books/reading-note-demo/chunks/chunk-0003.md"], "notes": ["wiki/books/reading-note-demo.md"]}, {"id": "small-experiment", "title": "把计划变成一个小实验", "author": "Book Wiki Reader 原创示例", "chunks": ["raw/books/small-experiment/chunks/chunk-0001.md", "raw/books/small-experiment/chunks/chunk-0002.md"], "notes": []}], "documents": [{"id": "raw/books/reading-note-demo/chunks/chunk-0001.md", "book": "reading-note-demo", "kind": "原文", "title": "把笔记写成能回答的问题", "text": "# 把笔记写成能回答的问题\n\n这是一篇为 Book Wiki Reader 初始化演示编写的短文，不是出版物摘录。它描述的是假设情景，用来观察分块、索引和笔记文件如何生成。\n\n## 一个常见的卡点\n\n假设小林每周读一篇文章。看到有道理的句子，他就复制到笔记里。半年后，他已经积累了很多摘录，却很少再打开。遇到一个实际问题时，他记得自己似乎读过相关内容，但不知道该搜什么。保存动作很顺手，重新使用却很费劲。\n\n问题未必出在笔记数量上。摘录保留了作者当时怎么说，却没有告诉未来的自己：这段话能回答什么问题、适用于什么条件，以及可以去哪里核对。因此，小林决定先改一条笔记，看看新的写法是否更容易找回来。\n\n## 从一句话开始\n\n他选中一段关于任务拆分的文字，先给它写了一个问题：“事情太大、不知道从哪一步开始时，可以做什么？”然后用自己的话写下作者的回答，并把原文位置留在旁边。这样，下次卡在类似问题上，他可以先搜问题，而不必记住原句。", "references": []}, {"id": "raw/books/reading-note-demo/chunks/chunk-0002.md", "book": "reading-note-demo", "kind": "原文", "title": "把判断留给读者", "text": "这一步不要求把整篇文章重新总结。笔记只需要保留足以理解主张的上下文。若一句建议依赖某个前提，就把前提也写下来。例如，任务可以拆成小步骤，并不意味着每一步都能独立完成；有些步骤需要先获得别人提供的信息。\n\n## 把判断留给读者\n\n作者的建议、小林的判断和试用结果应该分开。作者可能主张先把任务拆小；小林可能同意这个方向，但担心自己陷入过度规划；一次实际试用可能又表明，先写出下一步比列出全部步骤更适合当前任务。这三层内容各有来源，不能合成一句听起来确定的结论。\n\n如果 AI 参与整理，它可以帮助解释和比较，却不能替小林声称“这个方法对我有效”。在小林给出自己的尝试或回应之前，个人经验那一栏应当留空。空白能诚实地表示尚不知道，而不是一个急着填满的缺口。\n\n## 怎样判断有没有帮助", "references": []}, {"id": "raw/books/reading-note-demo/chunks/chunk-0003.md", "book": "reading-note-demo", "kind": "原文", "title": "原文 3", "text": "小林给自己安排一个很小的检查：下次遇到类似任务时，先在笔记里搜索那个问题。如果能找到相关主张、看懂适用条件，并定位到原文，这条笔记就比孤立的摘录更容易使用。如果仍然找不到，他可以调整问题的措辞，而不必立刻重建整个知识库。\n\n这只是一个可以尝试的笔记方法，不是关于所有人学习效率的研究结论。是否有帮助，需要看具体读者怎样使用它。读完后值得讨论的问题是：你通常在哪个时刻想起自己记过笔记，又在哪一步放弃寻找？", "references": []}, {"id": "raw/books/small-experiment/chunks/chunk-0001.md", "book": "small-experiment", "kind": "原文", "title": "把计划变成一个小实验", "text": "# 把计划变成一个小实验\n\n这是一篇为 Book Wiki Reader 编写的原创示例，人物与情景均为虚构。\n\n## 先写下不知道什么\n\n假设阿青想在周末做一个帮助朋友整理菜谱的小工具。他很快列出了账户、收藏、搜索和购物清单，却还不知道朋友最常在哪一步遇到麻烦。如果先开发所有功能，他可能把时间花在没人需要的地方。\n\n他把计划换成了一个可以回答的问题：“做晚饭之前，朋友更难决定吃什么，还是更难确认家里缺什么？”问题还没有答案，因此接下来要做的是观察一次准备晚饭的过程。\n\n## 让结果改变下一步\n\n阿青做了两个纸面样例。一个直接列出三道菜，另一个从冰箱已有食材开始。他请朋友各试一次，并记录在哪一步需要额外解释。如果两个样例都无法帮助朋友，他会先调整问题，而不是继续增加页面。\n\n这个小实验不证明一个产品一定成功。它只减少一个具体的不确定：下一次动手时，应该优先改善哪个步骤。样本很小，结论应该保留这个限制。", "references": []}, {"id": "raw/books/small-experiment/chunks/chunk-0002.md", "book": "small-experiment", "kind": "原文", "title": "把证据放在结论旁边", "text": "## 把证据放在结论旁边\n\n阿青的笔记分成三栏：试了什么、观察到了什么、下一步要做什么。“朋友停在食材选择页面”是观察；“食材分类不符合习惯”是解释；“试一版按冰箱位置分组的列表”是下一步。把它们分开，后来发现新证据时就能修改解释，而不必否定整份记录。\n\n下次回到项目，他先读问题和观察，再决定继续还是停止。一个有用的小实验，应当允许结果改变计划。", "references": []}, {"id": "wiki/books/reading-note-demo.md", "book": "reading-note-demo", "kind": "读书笔记", "title": "把笔记写成能回答的问题", "text": "# 把笔记写成能回答的问题\n\n## 这篇示例在回答什么\n\n收藏很多摘录以后，怎样在需要时找回有用的内容？\n\n## 文中的主张\n\n给摘录补上它能回答的问题、适用条件和原文位置。未来的自己可以从问题出发查找，而不必记住作者的原句。\n\n## 一个需要保留的限制\n\n这是演示文章提出的可尝试方法，不是已经证实对所有读者有效的研究结论。\n\n## 回到原文\n\n[查看问题与原文位置的段落](raw/books/reading-note-demo/chunks/chunk-0001.md)\n\n[查看作者主张与读者判断的区分](raw/books/reading-note-demo/chunks/chunk-0002.md)\n\n## 读者的判断\n\n尚未记录。这是仓库编写的展示笔记，没有代替任何真实读者声称读完、同意或实践有效。", "references": ["raw/books/reading-note-demo/chunks/chunk-0001.md", "raw/books/reading-note-demo/chunks/chunk-0002.md"]}, {"id": "wiki/themes/evidence.md", "book": null, "kind": "主题", "title": "让每个判断都能回到证据", "text": "# 让每个判断都能回到证据\n\n这是一张人工编写的跨文主题卡，用来演示来源跳转。\n\n## 两篇文章的共同问题\n\n一篇关心笔记如何重新使用，另一篇关心计划如何被观察结果修正。两者都要求把结论和它的来源放在一起。\n\n## 可以尝试的写法\n\n- 问题：我现在想回答什么？\n- 观察：原文或实际过程说了什么？\n- 判断：我怎样理解它？哪些还不知道？\n- 下一步：有什么小行动可以验证这个判断？\n\n## 来源\n\n[笔记与原文位置](raw/books/reading-note-demo/chunks/chunk-0002.md)\n\n[小实验的观察与解释](raw/books/small-experiment/chunks/chunk-0002.md)\n\n## 展示说明\n\n以上是针对原创示例的人工整理，不是脚本自动生成的跨书结论。", "references": ["raw/books/reading-note-demo/chunks/chunk-0002.md", "raw/books/small-experiment/chunks/chunk-0002.md"]}], "skipped": []}</script>
<script>
'use strict';
const library = JSON.parse(document.getElementById('library-data').textContent);
const documents = library.documents;
const byId = new Map(documents.map(d => [d.id,d]));
const byBook = new Map(library.books.map(b => [b.id,b]));
const $ = id => document.getElementById(id);
let view='all', bookFilter=null, selected=null, query='', kind='';
const storageKey='book-wiki-reader:'+library.id;
let progress={};
try {const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))progress=saved;} catch(e){$('storage-status').textContent='当前浏览器不允许保存，进度仅在本次打开时有效。';}
const readIds = new Set(Array.isArray(progress.read)?progress.read.filter(id=>byId.has(id)):[]);
function save(){try{localStorage.setItem(storageKey,JSON.stringify({read:[...readIds],last:selected}));}catch(e){$('storage-status').textContent='进度仅在本次打开时有效。';}}
function el(tag, cls, text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function terms(){return query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);}
function markText(node,text){const searchTerms=terms();if(!searchTerms.length){node.append(document.createTextNode(text));return;}const lower=text.toLocaleLowerCase();let offset=0;while(offset<text.length){let pos=-1,word='';for(const term of searchTerms){const found=lower.indexOf(term,offset);if(found!==-1&&(pos===-1||found<pos)){pos=found;word=term;}}if(pos===-1){node.append(document.createTextNode(text.slice(offset)));break;}node.append(document.createTextNode(text.slice(offset,pos)));node.append(el('mark','',text.slice(pos,pos+word.length)));offset=pos+word.length;}}
function excerpt(doc){const text=doc.text.replace(/^#{1,6}\s+/gm,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\s+/g,' ');const term=terms()[0];const index=term?text.toLocaleLowerCase().indexOf(term):-1;const start=Math.max(0,index-30);return(start?'…':'')+text.slice(start,start+118)+(text.length>start+118?'…':'');}
function listDocs(){return documents.filter(doc=>{if(bookFilter&&doc.book!==bookFilter)return false;if(kind&&doc.kind!==kind)return false;if(view==='notes'&&doc.kind==='原文')return false;if(view==='unread'&&(doc.kind!=='原文'||readIds.has(doc.id)))return false;const haystack=(doc.title+' '+doc.text).toLocaleLowerCase();return terms().every(term=>haystack.includes(term));}).sort((a,b)=>{if(query){const score=d=>terms().filter(t=>d.title.toLocaleLowerCase().includes(t)).length;return score(b)-score(a);}return (a.kind==='原文')-(b.kind==='原文');});}
function renderShelves(){const shelves=$('shelves');shelves.replaceChildren();for(const book of library.books){const button=el('button','shelf-item'+(bookFilter===book.id?' active':''));button.append(el('span','',book.title));const done=book.chunks.filter(id=>readIds.has(id)).length;button.append(el('small','',book.chunks.length?`${done} / ${book.chunks.length} 段已读`:'尚无可读原文'));const track=el('span','progress-track');const bar=el('i');bar.style.width=(book.chunks.length?done/book.chunks.length*100:0)+'%';track.append(bar);button.append(track);button.addEventListener('click',()=>{bookFilter=bookFilter===book.id?null:book.id;view='all';render();showList();});shelves.append(button);}}
function renderList(){const docs=listDocs();$('all-count').textContent=documents.length;$('note-count').textContent=documents.filter(d=>d.kind!=='原文').length;$('unread-count').textContent=documents.filter(d=>d.kind==='原文'&&!readIds.has(d.id)).length;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('list-title').textContent=query?'检索结果':bookFilter?byBook.get(bookFilter).title:view==='notes'?'留给未来的自己':view==='unread'?'下一段，从这里开始':'从这里继续读';$('list-desc').textContent=query?'多个关键词以空格分隔；匹配原文和笔记中的全部关键词。':bookFilter?'读原文，也看看留下了什么。':'让每一条理解，都能找到来处。';$('result-count').textContent=docs.length+' 篇';const results=$('results');results.replaceChildren();for(const doc of docs){const card=el('button','result-card'+(selected===doc.id?' selected':''));card.setAttribute('aria-pressed',String(selected===doc.id));const meta=el('div','result-meta');meta.append(el('span','result-kind',doc.kind),el('span','',doc.text.length.toLocaleString()+' 字符'));if(readIds.has(doc.id))meta.append(el('span','read-indicator','已读 ✓'));card.append(meta);const title=el('h2');markText(title,doc.title);card.append(title);const summary=el('p');markText(summary,excerpt(doc));card.append(summary);card.append(el('span','result-source',doc.book?byBook.get(doc.book).title:'跨书知识 · '+doc.kind));card.addEventListener('click',()=>openDoc(doc.id));results.append(card);}if(!docs.length)results.append(el('p','empty',query?'没有匹配的内容。试试更短的关键词，或清除书籍和类型筛选。':view==='unread'?'当前范围的原文都已标记读完。':'当前范围还没有内容。导入读物或写好 Markdown 笔记后，重新生成工作台。'));}
function resolveDoc(target,doc){let path=target.split('#')[0];try{path=decodeURIComponent(path);}catch(e){}if(byId.has(path))return path;const parts=doc.id.split('/').slice(0,-1);for(const part of path.split('/')){if(part==='..')parts.pop();else if(part!=='.'&&part)parts.push(part);}const candidate=parts.join('/');return byId.has(candidate)?candidate:null;}
function inline(node,text,doc){const pattern=/\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;let index=0;for(const match of text.matchAll(pattern)){markText(node,text.slice(index,match.index));if(match[1]){const target=resolveDoc(match[2],doc);if(target){const button=el('button','source-link',match[1]+' ↗');button.addEventListener('click',()=>openDoc(target));node.append(button);}else if(/^https?:\/\//i.test(match[2])){const a=el('a','',match[1]);a.href=match[2];a.target='_blank';a.rel='noopener noreferrer';node.append(a);}else{markText(node,match[1]);}}else{const child=el(match[3]?'strong':'code');markText(child,match[3]||match[4]);node.append(child);}index=match.index+match[0].length;}markText(node,text.slice(index));}
function prose(doc){const area=el('article','prose');area.id='content';let para=[],list=null;const flush=()=>{if(para.length){const p=el('p');inline(p,para.join('\n'),doc);area.append(p);para=[];}list=null;};for(const [number,line] of doc.text.split('\n').entries()){if(number===0&&/^#{1,3}\s+/.test(line)&&line.replace(/^#{1,3}\s+/,'')===doc.title)continue;const heading=/^(#{1,3})\s+(.+)$/.exec(line);if(heading){flush();const h=el('h'+Math.max(2,heading[1].length));inline(h,heading[2],doc);area.append(h);}else if(/^\s*[-*]\s+/.test(line)){if(para.length)flush();if(!list){list=el('ul');area.append(list);}const li=el('li');inline(li,line.replace(/^\s*[-*]\s+/,''),doc);list.append(li);}else if(line.startsWith('> ')){flush();const quote=el('blockquote');inline(quote,line.slice(2),doc);area.append(quote);}else if(!line.trim()){flush();}else{list=null;para.push(line);}}flush();return area;}
function renderReader(){const body=$('reader-body');body.replaceChildren();const doc=byId.get(selected);if(!doc){body.append(el('div','no-reader','选择一段原文或一条笔记，开始阅读。'));return;}const book=byBook.get(doc.book);const toolbar=el('div','reader-toolbar');const back=el('button','small-button mobile-back','← 列表');back.addEventListener('click',()=>showList());toolbar.append(back,el('span','breadcrumb',doc.kind+' / '+(book?book.title:'跨书知识')));const actions=el('div','reader-actions');if(doc.kind==='原文'){const toggle=el('button','small-button'+(readIds.has(doc.id)?' done':''),readIds.has(doc.id)?'已读 ✓':'标为已读');toggle.addEventListener('click',()=>{readIds.has(doc.id)?readIds.delete(doc.id):readIds.add(doc.id);save();render();});actions.append(toggle);}const copy=el('button','small-button','复制引用');copy.addEventListener('click',async()=>{const value=`${book?book.title:doc.title} · ${doc.kind}\n${doc.id}`;try{await navigator.clipboard.writeText(value);copy.textContent='已复制';}catch(e){const box=el('textarea');box.value=value;box.setAttribute('aria-label','引用路径，按复制快捷键复制');body.append(box);box.focus();box.select();copy.textContent='请复制下方路径';}});actions.append(copy);toolbar.append(actions);body.append(toolbar);const inner=el('div','reader-inner');const chunkIndex=book?book.chunks.indexOf(doc.id):-1;inner.append(el('div','reader-kicker',doc.kind==='原文'?`SOURCE / 原文 ${chunkIndex+1} OF ${book.chunks.length}`:'NOTE / 笔记与理解'));inner.append(el('h1','reader-title',doc.title));inner.append(el('div','reader-info',[book?book.author:'人工整理的 Markdown 笔记',doc.text.length.toLocaleString()+' 字符',library.demo?'原创演示材料':'本地书库'].filter(Boolean).join(' · ')));inner.append(prose(doc));let related=[];if(doc.kind==='原文'){related=documents.filter(d=>d.references.includes(doc.id)||(d.kind==='读书笔记'&&d.book===doc.book));}else if(doc.references.length){related=doc.references.map(id=>byId.get(id));}else if(book){related=book.chunks.slice(0,1).map(id=>byId.get(id));}if(related.length){const ref=el('div','reference-box');ref.append(el('h3','',doc.kind==='原文'?'阅读这段原文时留下的笔记':'回到来源'));for(const item of related){const button=el('button','',`${item.kind} · ${item.title} ↗`);button.addEventListener('click',()=>openDoc(item.id));ref.append(button);}inner.append(ref);}if(chunkIndex!==-1){const pager=el('div','pager');for(const [label,index]of[['← 上一段',chunkIndex-1],['下一段 →',chunkIndex+1]]){const button=el('button','',label);button.disabled=index<0||index>=book.chunks.length;if(!button.disabled)button.addEventListener('click',()=>openDoc(book.chunks[index]));pager.append(button);}inner.append(pager);}inner.append(el('p','reader-status',doc.id));body.append(inner);}
function showList(){document.body.classList.remove('reading');window.scrollTo({top:0,behavior:'instant'});}
function render(){renderShelves();renderList();renderReader();}
function openDoc(id,updateHash=true){if(!byId.has(id))return;selected=id;save();if(updateHash)history.replaceState(null,'','#'+encodeURIComponent(id));renderList();renderReader();document.body.classList.add('reading');window.scrollTo({top:0,behavior:'instant'});}
function readHash(){try{return decodeURIComponent(location.hash.slice(1));}catch(e){return '';}}
$('search').addEventListener('input',e=>{query=e.target.value;renderList();renderReader();showList();});$('kind').addEventListener('change',e=>{kind=e.target.value;renderList();showList();});document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;bookFilter=null;render();showList();}));for(const value of [...new Set(documents.map(d=>d.kind))]){const option=el('option','',value);option.value=value;$('kind').append(option);}$('reset-progress').addEventListener('click',()=>{readIds.clear();save();render();});document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();$('search').focus();}});window.addEventListener('hashchange',()=>openDoc(readHash(),false));$('demo-banner').hidden=!library.demo;selected=byId.has(readHash())?readHash():byId.has(progress.last)?progress.last:documents.find(d=>d.kind==='读书笔记')?.id||documents[0]?.id||null;render();if(readHash()&&selected)document.body.classList.add('reading');
</script>
</body>
</html>
